# Copies the built web app (dist/) to an S3-compatible bucket with static website hosting, as a
# second address for the game next to GitHub Pages (for networks where GitHub is unreliable).
# Defaults to Yandex Object Storage; any S3-compatible storage works by setting MIRROR_ENDPOINT
# and MIRROR_REGION. Does nothing until the bucket and keys below are set in the repository:
#   Settings → Secrets and variables → Actions
#     Secrets:   MIRROR_KEY_ID, MIRROR_SECRET (a static access key with write access to the bucket)
#     Variables: MIRROR_BUCKET (bucket name); optional MIRROR_ENDPOINT, MIRROR_REGION, and
#                MIRROR_SITE_URL (the site address, for providers other than Yandex)
name: Mirror web app

# Runs on every push to these branches (a few small files). To upload right after setting the
# keys, re-run the latest run of this workflow from the Actions tab.
on:
  push:
    branches: [main, claude/adoring-newton-e9l4sf]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.MIRROR_BUCKET }}
      ENDPOINT: ${{ vars.MIRROR_ENDPOINT || 'https://storage.yandexcloud.net' }}
      AWS_DEFAULT_REGION: ${{ vars.MIRROR_REGION || 'ru-central1' }}
      SITE: ${{ vars.MIRROR_SITE_URL || format('https://{0}.website.yandexcloud.net/', vars.MIRROR_BUCKET) }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_SECRET }}
      # newer AWS CLI versions add checksum headers that S3-compatible storage may reject
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Mirror not configured
        if: env.BUCKET == ''
        run: echo "::notice::Set MIRROR_BUCKET, MIRROR_KEY_ID and MIRROR_SECRET to enable the mirror."
      - uses: actions/checkout@v4
        if: env.BUCKET != ''
      - name: Check the key
        if: env.BUCKET != ''
        run: |
          # keys never contain spaces; drop any copied along with them (a trailing newline or space
          # breaks the request signature) and pass the cleaned keys to the next steps
          id=$(printf %s "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')
          secret=$(printf %s "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')
          echo "::add-mask::$secret"
          echo "Key ID: ${#id} characters (${#AWS_ACCESS_KEY_ID} before removing spaces); secret: ${#secret} characters (${#AWS_SECRET_ACCESS_KEY} before)"
          echo "AWS_ACCESS_KEY_ID=$id" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"
          # a listing returns an error code in its body (a HEAD request would only say 403)
          if ! out=$(AWS_ACCESS_KEY_ID="$id" AWS_SECRET_ACCESS_KEY="$secret" aws s3api list-objects-v2 --bucket "$BUCKET" --max-keys 1 --endpoint-url "$ENDPOINT" 2>&1); then
            echo "$out"
            case "$out" in
              *SignatureDoesNotMatch*) echo "::error::The secret key is wrong: MIRROR_SECRET (${#secret} characters) does not belong to MIRROR_KEY_ID. A Yandex Cloud secret key is 40 characters; paste it again in full, or create a new static key and paste both values." ;;
              *InvalidAccessKeyId*) echo "::error::Unknown key ID: check MIRROR_KEY_ID." ;;
              *AccessDenied*) echo "::error::The key is valid but its service account has no access: give it the storage.uploader role on the folder." ;;
              *NoSuchBucket*) echo "::error::No bucket named $BUCKET: check MIRROR_BUCKET." ;;
              *) echo "::error::Could not reach the bucket." ;;
            esac
            exit 1
          fi
          echo "The key works for bucket $BUCKET"
      - name: Upload
        if: env.BUCKET != ''
        run: |
          put() { aws s3 cp "dist/$1" "s3://$BUCKET/$1" --endpoint-url "$ENDPOINT" --content-type "$2" --cache-control "$3" --only-show-errors; }
          # icons and manifest first, then the page, then the service worker: a new worker only
          # installs once everything it caches is in place
          put icon.svg image/svg+xml "max-age=3600"
          put icon-180.png image/png "max-age=3600"
          put icon-192.png image/png "max-age=3600"
          put icon-512.png image/png "max-age=3600"
          put manifest.webmanifest application/manifest+json "no-cache"
          put index.html "text/html; charset=utf-8" "no-cache"
          put sw.js "application/javascript; charset=utf-8" "no-cache"
          echo "Uploaded to $BUCKET"
      - name: Check the site
        if: env.BUCKET != ''
        run: |
          code=$(curl -s -o page.html -w '%{http_code}' "$SITE")
          echo "$SITE answered HTTP $code"
          if [ "$code" != 200 ]; then
            echo "::error::The site answered $code instead of the game. Check that objects are readable by everyone and that Website hosting is on with index.html as the main page."
            exit 1
          fi
          grep -q 'rel="manifest"' page.html || { echo "::error::$SITE does not serve the game page."; exit 1; }
          echo "::notice::The game is live at $SITE ($(grep -o 'commit:"[^"]*"' page.html | head -1))"
